experiment_name: B0-CE
objective:
  mode: ce
seed: 42
data:
  root_env: DATA_ROOT
  train_manifest_env: DATA_CONFIG
  max_seq_len: 3072
training:
  precision: bf16
  batch_size_per_gpu: 4
  gradient_accumulation: 2
  max_optimizer_steps: 2200
  checkpoint_every_steps: 500
optimization:
  optimizer: AdamW
  learning_rate: 1.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  clip_grad_norm: 4.0
distributed:
  nproc_per_node: 4
  global_batch_size: 32
notes:
  parameter_source: "GCE matched CE baseline; not matched to the attention setup."
