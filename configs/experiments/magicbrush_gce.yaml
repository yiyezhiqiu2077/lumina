experiment_name: G1-GCE
seed: 42
model:
  path_env: MODEL_PATH
data:
  root_env: DATA_ROOT
  train_manifest_env: DATA_CONFIG
  max_seq_len: 3072
training:
  precision: bf16
  batch_size_per_gpu: 4
  gradient_accumulation: 2
  max_optimizer_steps: 2200
  checkpoint_every_steps: 500
optimization:
  optimizer: AdamW
  learning_rate: 1.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  clip_grad_norm: 4.0
distributed:
  nproc_per_node: 4
  global_batch_size: 32
gce:
  enabled: true
  weight: 1.0
  levels: [1024, 512]
  cluster_path_env: GCE_CLUSTER_PATH
