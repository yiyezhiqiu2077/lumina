experiment_name: MIXED-GCE-4G-CORRECTNESS-S42
output_name: MIXED-GCE-4G-CORRECTNESS-S42
objective: {mode: gce}
seed: 42
condition_dropout: 0.1
dataset_config: configs/dataset/mixed_edit.yaml
distributed_config: configs/distributed/single_node.yaml
paths: {model_env: MODEL_PATH, data_root_env: DATA_ROOT, train_manifest_env: DATA_CONFIG, output_root_env: OUTPUT_ROOT}
data: {max_seq_len: 5120}
training: {precision: bf16, batch_size_per_gpu: 4, gradient_accumulation: 2, epochs: 10, max_optimizer_steps: 20, scheduler_horizon_steps: formal_auto, checkpoint_every_steps: 20}
optimization: {optimizer: AdamW, learning_rate: 3.0e-6, betas: [0.9, 0.95], weight_decay: 0.1, clip_grad_norm: 4.0, warmup_steps: 20, loss_reduction: token_mean, z_loss_weight: 1.0e-5}
lora: {rank: 16, alpha: 16.0, dropout: 0.05, targets: [q_proj, k_proj, v_proj, attn_out]}
diagnostics: {every_steps: 5, gradient_decomposition_every_steps: 5}
quality_gate: {enabled: false}
distributed: {nproc_per_node: 4, global_batch_size: 32}
gce: {cluster_path_env: GCE_CLUSTER_PATH, weight: 1.0, levels: [1024, 512]}
