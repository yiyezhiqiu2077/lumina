experiment_name: A1-ATTN
output_name: A1-ATTN
objective:
  mode: attention
seed: 42
dataset_config: configs/dataset/magicbrush.yaml
distributed_config: configs/distributed/single_node.yaml
paths:
  model_env: MODEL_PATH
  data_root_env: DATA_ROOT
  train_manifest_env: DATA_CONFIG
  output_root_env: OUTPUT_ROOT
data:
  root_env: DATA_ROOT
  train_manifest_env: DATA_CONFIG
  max_seq_len: 5120
training:
  precision: bf16
  batch_size_per_gpu: 8
  gradient_accumulation: 4
  max_optimizer_steps: 2750
  checkpoint_every_steps: 275
optimization:
  optimizer: AdamW
  learning_rate: 1.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  clip_grad_norm: 4.0
  warmup_steps: 20
lora:
  rank: 16
  alpha: 16.0
  dropout: 0.05
distributed:
  nproc_per_node: 2
  global_batch_size: 64
attention_loss:
  weight: 0.1
  layers: [24, 25, 26, 27]
  query: real_instruction_tokens
  keys: clean_source_image_spatial_tokens
  target: normalized_gt_edit_mask_cross_entropy
