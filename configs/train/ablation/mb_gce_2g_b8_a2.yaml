experiment_name: MB-GCE-2G-B8-A2-S42
output_name: MB-GCE-2G-B8-A2-S42
objective:
  mode: gce
seed: 42
condition_dropout: 0.1
dataset_config: configs/dataset/magicbrush.yaml
distributed_config: configs/distributed/single_node.yaml
paths:
  model_env: MODEL_PATH
  data_root_env: DATA_ROOT
  train_manifest_env: DATA_CONFIG
  output_root_env: OUTPUT_ROOT
data:
  root_env: DATA_ROOT
  train_manifest_env: DATA_CONFIG
  max_seq_len: 5120
training:
  precision: bf16
  batch_size_per_gpu: 8
  gradient_accumulation: 2
  max_optimizer_steps: 2750
  checkpoint_every_steps: 275
optimization:
  optimizer: AdamW
  learning_rate: 1.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.1
  clip_grad_norm: 4.0
  warmup_steps: 20
lora:
  rank: 16
  alpha: 16.0
  dropout: 0.05
distributed:
  nproc_per_node: 2
  global_batch_size: 32
gce:
  weight: 1.0
  levels: [1024, 512]
  cluster_path_env: GCE_CLUSTER_PATH
