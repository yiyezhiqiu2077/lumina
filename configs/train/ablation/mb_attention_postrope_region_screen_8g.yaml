experiment_name: MB-ATTN-POSTROPE-REGION-SCREEN-8G-S42
output_name: MB-ATTN-POSTROPE-REGION-SCREEN-8G-S42
objective:
  mode: attention
seed: 42
condition_dropout: 0.1
dataset_config: configs/dataset/magicbrush.yaml
distributed_config: configs/distributed/single_node.yaml
paths:
  model_env: MODEL_PATH
  data_root_env: DATA_ROOT
  train_manifest_env: DATA_CONFIG
  output_root_env: OUTPUT_ROOT
data:
  root_env: DATA_ROOT
  train_manifest_env: DATA_CONFIG
  max_seq_len: 5120
training:
  precision: bf16
  batch_size_per_gpu: 4
  gradient_accumulation: 1
  max_optimizer_steps: 275
  scheduler_horizon_steps: 2750
  checkpoint_every_steps: 275
optimization:
  optimizer: AdamW
  learning_rate: 3.0e-6
  betas: [0.9, 0.95]
  weight_decay: 0.1
  clip_grad_norm: 4.0
  warmup_steps: 20
  loss_reduction: sample_mean
  z_loss_weight: 1.0e-5
lora:
  rank: 16
  alpha: 16.0
  dropout: 0.05
  targets: [q_proj, k_proj, v_proj, attn_out]
diagnostics:
  every_steps: 25
  gradient_decomposition_every_steps: 25
quality_gate:
  enabled: true
  baseline_start: 101
  baseline_end: 275
  window_size: 50
  max_loss_ratio: 1.75
  consecutive_windows: 2
  max_clip_fraction: 0.95
  max_abs_logit: 1.0e4
  max_update_ratio: 0.25
distributed:
  nproc_per_node: 8
  global_batch_size: 32
attention_loss:
  weight: 0.1
  qk_stage: post_rope
  mode: region_mass
  layers: [24, 25, 26, 27]
  query: real_instruction_tokens
  keys: clean_source_image_spatial_tokens
  target: gt_edit_region_mass
