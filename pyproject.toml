[project]
name = "lumina-dimoo-magicbrush"
version = "0.1.0"
description = "Lumina-DiMOO training, inference, and MagicBrush experiments"
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate==1.14.0",
  "diffusers==0.34.0",
  "einops==0.8.2",
  "numpy==1.26.4",
  "pillow==10.4.0",
  "pyarrow==17.0.0",
  "pyyaml==6.0.3",
  "safetensors==0.8.0",
  "sentencepiece==0.2.2",
  "torch==2.3.1",
  "torchaudio==2.3.1",
  "torchvision==0.18.1",
  "transformers==4.46.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
upstream = ["fairscale", "h5py", "pandas", "tensorboard"]
analysis = ["matplotlib>=3.8,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dataset*", "models*", "training*", "utils*", "generators*", "xllmx*"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
