[project]
name = "lumina-dimoo-magicbrush-experiments"
version = "0.1.0"
description = "Reproducible MagicBrush GCE and attention-supervision experiments for Lumina-DiMOO"
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate==1.14.0",
  "diffusers==0.34.0",
  "einops==0.8.2",
  "numpy==1.26.4",
  "pillow==10.4.0",
  "pyyaml==6.0.3",
  "safetensors==0.8.0",
  "sentencepiece==0.2.2",
  "torch==2.3.1",
  "torchaudio==2.3.1",
  "torchvision==0.18.1",
  "transformers==4.46.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
